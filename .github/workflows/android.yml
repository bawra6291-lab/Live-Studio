name: Android companion validation
on:
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'app/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Address and origin restriction tests
        run: bash mobile/android/test.sh
      - name: Build and verify signed pilot APK
        run: bash mobile/android/build.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed Android pairing and control test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python mobile/android/qa/server.py > mobile/android/build/server.log 2>&1 &
            python mobile/android/qa/smoke.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-desk-android-pilot
          path: |
            mobile/android/build/Live-Desk-Mobile-0.1.0.apk
            mobile/android/build/SHA256SUMS
            mobile/android/build/signature.txt
            mobile/android/build/manifest.txt
            mobile/android/build/android-*.png
            mobile/android/build/android-report.json
            mobile/android/build/android-window.xml
            mobile/android/build/server.log
          retention-days: 30
